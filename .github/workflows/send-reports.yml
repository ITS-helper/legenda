name: Send Reports

on:
  schedule:
    - cron: '0 5 * * *'    # 08:00 МСК — daily (после импорта 07:50)
    - cron: '20 5 * * *'   # 08:20 МСК — резерв daily (дедлайн 08:30)
    - cron: '25 5 * * 1'  # 08:25 МСК пн — weekly (дедлайн 08:30)
  workflow_run:
    workflows: [Sync Drive Reports]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      type:
        description: 'Тип отчёта'
        required: true
        default: daily
        type: choice
        options:
          - daily
          - weekly

jobs:
  send:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Send reports
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          ADMIN_PASSWORD: ${{ secrets.SETTINGS_ADMIN_PASSWORD }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_TYPE: ${{ inputs.type }}
        run: |
          set -e

          send_report() {
            local report_type="$1"
            local trigger_source="$2"
            echo "=== send-report: $report_type (trigger: $trigger_source) ==="
            RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST \
              "$SUPABASE_URL/functions/v1/send-report" \
              -H "Content-Type: application/json" \
              -H "apikey: $ANON_KEY" \
              -H "Authorization: Bearer $ANON_KEY" \
              -H "x-settings-password: $ADMIN_PASSWORD" \
              -H "x-triggered-by: $trigger_source" \
              -d "{\"type\":\"$report_type\"}")
            BODY=$(echo "$RESPONSE" | head -n -1)
            CODE=$(echo "$RESPONSE" | tail -n 1)
            echo "HTTP $CODE"
            echo "$BODY"
            if [ "$CODE" -ge 300 ]; then
              echo "::error::send-report $report_type failed"
              exit 1
            fi
          }

          SEND_DAILY=false
          SEND_WEEKLY=false

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$DISPATCH_TYPE" = "weekly" ]; then
              SEND_WEEKLY=true
            else
              SEND_DAILY=true
            fi
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            SEND_DAILY=true
          elif [ "$SCHEDULE" = "0 5 * * *" ] || [ "$SCHEDULE" = "20 5 * * *" ]; then
            SEND_DAILY=true
          elif [ "$SCHEDULE" = "25 5 * * 1" ]; then
            SEND_WEEKLY=true
          else
            echo "Неизвестное расписание: $SCHEDULE"
            exit 1
          fi

          TRIGGER_SOURCE="schedule"
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            TRIGGER_SOURCE="post-import"
          fi

          if [ "$SEND_DAILY" = "true" ]; then
            send_report daily "$TRIGGER_SOURCE"
          fi
          if [ "$SEND_WEEKLY" = "true" ]; then
            send_report weekly "$TRIGGER_SOURCE"
          fi
