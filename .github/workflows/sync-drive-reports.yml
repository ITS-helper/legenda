name: Sync Drive Reports

on:
  schedule:
    - cron: '30 2 * * *'  # 05:30 МСК — первая попытка (отчёты в Drive ~04:00)
    - cron: '0 4 * * *'    # 07:00 МСК — повтор
    - cron: '30 4 * * *'  # 07:30 МСК — последний импорт перед рассылкой
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Дата отчета: 2026-07-01 или 01.07.2026 (пусто = вчера по МСК)'
        required: false
        type: string
      force:
        description: 'Переимпортировать даже если batch уже ready'
        required: false
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync reports from Google Drive
        run: |
          ARGS=""
          if [ -n "${{ inputs.report_date }}" ]; then
            ARGS="$ARGS --date ${{ inputs.report_date }}"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          npm run sync:drive -- $ARGS
